# Release build of the provider for the Terraform Registry and the OpenTofu
# Registry: zip archives named terraform-provider-mistral_<version>_<os>_<arch>,
# the registry manifest, the SHA256SUMS file and its binary GPG signature
# (https://developer.hashicorp.com/terraform/registry/providers/publishing).
# Run by .github/workflows/goreleaser-release.yml; checked on every pull
# request by goreleaser-check.yml.
version: 2
# No `go mod tidy` hook: a release builds exactly what main holds, which the
# tidy-check of every pull request already verified.
builds:
- env:
    # goreleaser does not work with CGO, it could also complicate
    # usage by users in CI/CD systems like HCP Terraform where
    # they are unable to install libraries.
    - CGO_ENABLED=0
  mod_timestamp: '{{ .CommitTimestamp }}'
  flags:
    - -trimpath
  # main.version is the only variable main.go declares: the linker ignores a
  # -X of an undeclared one without a warning.
  ldflags:
    - '-s -w -X main.version={{.Version}}'
  goos:
    - freebsd
    - windows
    - linux
    - darwin
  goarch:
    - amd64
    - '386'
    - arm
    - arm64
  ignore:
    - goos: darwin
      goarch: '386'
    - goos: windows
      goarch: arm
  binary: '{{ .ProjectName }}_v{{ .Version }}'
archives:
- formats:
  - zip
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      # if you are using this in a GitHub action or some other automated pipeline, you
      # need to pass the batch flag to indicate its not interactive.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}" # set this environment variable for your signing key
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  # A tag with a pre-release suffix (v1.0.0-rc.1, which the tag filter of
  # goreleaser-release.yml also matches) publishes a GitHub pre-release, which
  # never becomes the repository's latest release.
  prerelease: auto
  # If you want to manually examine the release before its live, uncomment this line:
  # draft: true
# The release notes: the commits since the previous tag, grouped by their
# Conventional Commits type (CONTRIBUTING.md), which every pull request checks.
# A "!" after the type marks a breaking change, in 0.x as after 1.0.0. Each
# regexp is matched against the commit subject, without its SHA, and anchored
# at its start: unanchored, a type inside a word of the description (latest:,
# prefix:, defeat:) would drop the commit or file it under the wrong group.
changelog:
  use: git
  sort: asc
  abbrev: 7
  groups:
    - title: Breaking changes
      regexp: '^[[:word:]]+(\([^)]+\))??!:.+$'
      order: 0
    - title: Features
      regexp: '^feat(\([^)]+\))??:.+$'
      order: 1
    - title: Fixes
      regexp: '^fix(\([^)]+\))??:.+$'
      order: 2
    - title: Performance
      regexp: '^perf(\([^)]+\))??:.+$'
      order: 3
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^(chore|ci|test|style)(\([^)]+\))??:.+$'
