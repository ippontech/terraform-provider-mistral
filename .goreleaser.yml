# Release build of the provider for the Terraform Registry and the OpenTofu
# Registry: zip archives named terraform-provider-mistral_<version>_<os>_<arch>,
# the registry manifest, the SHA256SUMS file and its binary GPG signature
# (https://developer.hashicorp.com/terraform/registry/providers/publishing).
# Run by .github/workflows/goreleaser-release.yml on the tag semantic-release
# pushes, and attaches them to the GitHub release semantic-release created
# with its notes (RELEASE.md, How a release is cut); checked on every pull
# request by goreleaser-check.yml.
version: 2
# No `go mod tidy` hook: a release builds exactly what main holds, which the
# tidy-check of every pull request already verified.
builds:
- env:
    # goreleaser does not work with CGO, it could also complicate
    # usage by users in CI/CD systems like HCP Terraform where
    # they are unable to install libraries.
    - CGO_ENABLED=0
  mod_timestamp: '{{ .CommitTimestamp }}'
  flags:
    - -trimpath
  # main.version is the only variable main.go declares: the linker ignores a
  # -X of an undeclared one without a warning.
  ldflags:
    - '-s -w -X main.version={{.Version}}'
  goos:
    - freebsd
    - windows
    - linux
    - darwin
  goarch:
    - amd64
    - '386'
    - arm
    - arm64
  ignore:
    - goos: darwin
      goarch: '386'
    - goos: windows
      goarch: arm
  binary: '{{ .ProjectName }}_v{{ .Version }}'
archives:
- formats:
  - zip
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      # if you are using this in a GitHub action or some other automated pipeline, you
      # need to pass the batch flag to indicate its not interactive.
      - "--batch"
      - "--local-user"
      # The "!" makes gpg sign with this exact key, the primary key the
      # registries know (goreleaser-release.yml, Check the signing key): a
      # fingerprint alone lets gpg pick the newest signing subkey, which the
      # key registered for the namespace may not hold.
      - "{{ .Env.GPG_FINGERPRINT }}!"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  # The GitHub release exists before this build runs: semantic-release creates
  # it, with its notes, right after it pushes the tag. GoReleaser then only
  # attaches the archives, the manifest, the checksums and the signature to
  # it, and leaves its name and notes as they are; the default, replace,
  # would overwrite the notes with the (disabled) changelog below. A release
  # that does not exist yet, after a tag pushed by hand, is created with
  # empty notes.
  mode: keep-existing
  # A tag with a pre-release suffix (v1.0.0-rc.1, which the tag filter of
  # goreleaser-release.yml also matches) publishes a GitHub pre-release, which
  # never becomes the repository's latest release. semantic-release cuts none
  # from main (RELEASE.md, Versions).
  prerelease: auto
  # If you want to manually examine the release before its live, uncomment this line:
  # draft: true
# The release notes are semantic-release's (.releaserc, release-notes-generator
# with the conventionalcommits preset): the commits since the previous tag,
# grouped by their Conventional Commits type, with a link to each commit and
# the issues it closes. The same notes go to CHANGELOG.md. GoReleaser writes
# none, and keeps the ones on the release (release.mode above).
changelog:
  disable: true
