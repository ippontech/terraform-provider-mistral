name: Provider

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # Free for public repositories only: skipped while the repository is private.
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code || (echo "Run 'make fmt' and commit the result." && exit 1)

      - name: Check go.mod tidiness
        run: make tidy-check

      # Fails if a module in the module cache changed after it was downloaded.
      - name: Verify module checksums
        run: go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Keep in step with golangci-lint in mise.toml. golangci-lint refuses a
          # module whose go.mod toolchain is a newer Go minor than the Go its
          # binary was built with (v2.15.0: go1.27.0).
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.15.0

      # tools/ is a Go module of its own, which the run above does not see:
      # the same version, with the same configuration.
      - name: Run golangci-lint on the tools module
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.15.0
          working-directory: tools
          args: --config=../.golangci.yml

  # The complexity ratchet (tools/complexity, `make complexity`): every function
  # in the non-test Go files under internal/ and tools/ scores 20 or less in
  # cognitive complexity, unless it already scored more at the merge base and
  # its score did not rise. Nothing is committed: once no function on main
  # scores above 20, the cap is absolute. A required check: it fails, it does
  # not warn.
  complexity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # Free for public repositories only: skipped while the repository is private.
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            checkpoint-api.hashicorp.com:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            releases.hashicorp.com:443
            storage.googleapis.com:443

      # The whole history, so that the merge base exists.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # BASE_SHA is the base branch's commit of the pull request, or of the
      # merge queue entry; the ratchet compares with its merge base with HEAD.
      - name: Complexity ratchet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: make --no-print-directory complexity COMPLEXITY_BASE="${BASE_SHA}" >> "${GITHUB_STEP_SUMMARY}"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # Free for public repositories only: skipped while the repository is private.
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            checkpoint-api.hashicorp.com:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            releases.hashicorp.com:443
            storage.googleapis.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # resource.UnitTest runs the Terraform CLI against an httptest fake of
      # the API. The wrapper would interfere with terraform-exec's output.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Build
        run: make build

      - name: Run unit tests
        run: make test COVERPROFILE=coverage.out

      # The coverage job below enforces the gate on this profile.
      - name: Upload coverage profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # Free for public repositories only: skipped while the repository is private.
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            checkpoint-api.hashicorp.com:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            releases.hashicorp.com:443
            storage.googleapis.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Run generate
        run: make generate

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code || (echo "Running 'make generate' produced changes. Please run it locally and commit the result." && exit 1)

      # A route a fake starts serving must have its fingerprint in
      # tools/specdrift/fingerprints.txt, which the weekly spec-drift.yml
      # compares with Mistral's specification. Offline: no specification here.
      - name: Check the spec-drift fingerprints
        run: go run -C tools ./specdrift -routes-only -root ..

  # The coverage gate (.coverage.json, tools/coversummary), three fixed
  # thresholds: at least 75% of the statements a pull request changes are
  # covered (diff_min), the total is at 80% or more (total_target), and so is
  # every package (package_min). There is no ratchet on the total: near full
  # coverage, it failed pull requests on statements no test can reach, and the
  # diff and package rules already catch untested new code and a real drop. A
  # required check: it fails, it does not warn. The summary lists each
  # package's and each resource file's coverage, least covered first.
  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # Free for public repositories only: skipped while the repository is private.
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443

      # The whole history, so that the base commit and the merge base exist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      # BASE_SHA is the base branch's commit of the pull request, or of the
      # merge queue entry. The diff rule reads the lines the change adds or
      # modifies since its merge base with HEAD. The git diff flags are those
      # of `make cover`, which fix the format coversummary parses.
      - name: Coverage gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git diff --no-ext-diff --no-textconv --src-prefix=a/ --dst-prefix=b/ --unified=0 --inter-hunk-context=0 --no-color \
            "${BASE_SHA}...HEAD" > "${RUNNER_TEMP}/changes.diff"
          go run -C tools ./coversummary -config ../.coverage.json \
            -diff "${RUNNER_TEMP}/changes.diff" ../coverage.out >> "${GITHUB_STEP_SUMMARY}"
