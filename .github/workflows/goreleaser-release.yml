name: GoReleaser Release

# Builds, signs and publishes a release when a maintainer pushes a version tag
# on a commit of main (RELEASE.md, Cutting a release). The Terraform Registry
# and the OpenTofu Registry ingest the GitHub release.
#
# The job holds the signing key, so it follows the rules for privileged jobs
# (RELEASE.md, Release security):
#   - the GPG key and its passphrase are secrets of the protected `release`
#     environment, not repository secrets;
#   - no cache is restored or saved: a tag run can restore the caches of
#     main, so a cache written by any job on main could otherwise run code
#     in the job that signs;
#   - the checkout keeps no credential (persist-credentials: false), and the
#     modules are verified against go.sum before the build;
#   - tags are protected by a ruleset (RELEASE.md), so only repository
#     admins create them, and nobody moves or deletes them;
#   - the tagged commit must be on main, so that a release ships only what
#     the pull request checks accepted.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Runs before the approval that releases the GPG key, with no secret: it
  # writes on the run's summary page the go.mod lines that changed since the
  # previous release tag, which the approver checks (RELEASE.md, Approving a
  # release). go.mod lists every module compiled into the provider.
  dependency-changes:
    # The registries ingest public repositories only.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # Free for public repositories only: skipped while the repository is private.
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the previous release tag and its go.mod
          persist-credentials: false

      - name: List the go.mod changes since the previous release
        run: |
          set -euo pipefail
          {
            if previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${GITHUB_SHA}^" 2>/dev/null); then
              changes=$(git diff --unified=0 "${previous}" "${GITHUB_SHA}" -- go.mod | grep -E '^[-+][^-+]' || true)
              echo "## go.mod changes from ${previous} to ${GITHUB_REF_NAME}"
              echo
              if [ -z "${changes}" ]; then
                echo "None: this release compiles the same modules as ${previous}."
              else
                echo "Check each change before approving the release job (RELEASE.md, *Approving a release*)."
                echo
                echo '```diff'
                echo "${changes}"
                echo '```'
              fi
              echo
              echo "Full diff: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
            else
              echo "## Modules of ${GITHUB_REF_NAME}, the first release"
              echo
              echo "No previous release tag: every module of go.mod ships for the first time."
              echo
              echo '```'
              awk '/^require \(/ { inside = 1; next } inside && /^\)/ { inside = 0 } inside || /^(go|toolchain|require) [^(]/' go.mod
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  goreleaser-release:
    needs: dependency-changes
    # The registries ingest public repositories only.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - name: Harden runner
        # Free for public repositories only: skipped while the repository is private.
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          # raw.githubusercontent.com, go.dev, dl.google.com: setup-go's
          # fallback hosts (govulncheck.yml explains them).
          allowed-endpoints: >
            api.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the previous tag for the release notes, and main for the check below
          persist-credentials: false

      - name: Check that the tag is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error title=Release::${GITHUB_REF_NAME} points to ${GITHUB_SHA}, which is not on main: tag a commit of main."
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Verify module sources
        run: go mod download && go mod verify

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
