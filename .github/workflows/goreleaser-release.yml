name: GoReleaser Release

# Builds, signs and publishes a release when a maintainer pushes a version tag
# on a commit of main (RELEASE.md, Cutting a release). The Terraform Registry
# and the OpenTofu Registry ingest the GitHub release.
#
# The job holds the signing key, so it follows the rules for privileged jobs
# (RELEASE.md, Release security):
#   - the GPG key and its passphrase are secrets of the protected `release`
#     environment, not repository secrets;
#   - no cache is restored or saved: a tag run can restore the caches of
#     main, so a cache written by any job on main could otherwise run code
#     in the job that signs;
#   - the checkout keeps no credential (persist-credentials: false), and the
#     modules are verified against go.sum before the build;
#   - tags are protected by a ruleset (RELEASE.md), so only repository
#     admins create them, and nobody moves or deletes them;
#   - the tagged commit must be on main, so that a release ships only what
#     the pull request checks accepted.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Runs before the approval that releases the GPG key, with no secret. It
  # stops the run when the tag is below the version the Conventional Commits
  # since the last published release call for, or not above every other
  # release tag (tools/release-version.sh, RELEASE.md, Choosing the version),
  # so that nothing is approved, signed or published under a wrong number.
  # Then it writes on the run's summary page the go.mod lines that changed
  # since the last published release, which the approver checks (RELEASE.md,
  # Approving a release); go.mod lists every module compiled into the
  # provider. It hands that release to the release job, whose notes start
  # there: a tag whose release was refused never cuts them short.
  dependency-changes:
    # The registries ingest public repositories only.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - name: Harden runner
        # Free for public repositories only: skipped while the repository is private.
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the previous release tag and its go.mod
          persist-credentials: false

      # The tag cannot be deleted (version-tags ruleset): on a failure, tag the
      # version the message gives, which `make release-version` prints too. gh
      # reads the last published release with the read-only token of the job.
      - name: Check the version of the tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! result=$(tools/release-version.sh check "${GITHUB_REF_NAME}" 2>&1); then
            echo "::error title=Release::${result}. Nothing was approved, signed or published: tag the version that make release-version prints instead (RELEASE.md, Choosing the version)."
            exit 1
          fi
          echo "${result}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "previous=$(tools/release-version.sh previous HEAD^)" >> "${GITHUB_OUTPUT}"

      - name: List the go.mod changes since the last published release
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          {
            if [ -n "${PREVIOUS}" ]; then
              previous=${PREVIOUS}
              changes=$(git diff --unified=0 "${previous}" "${GITHUB_SHA}" -- go.mod | grep -E '^[-+][^-+]' || true)
              echo "## go.mod changes from ${previous} to ${GITHUB_REF_NAME}"
              echo
              if [ -z "${changes}" ]; then
                echo "None: this release compiles the same modules as ${previous}."
              else
                echo "Check each change before approving the release job (RELEASE.md, *Approving a release*)."
                echo
                echo '```diff'
                echo "${changes}"
                echo '```'
              fi
              echo
              echo "Full diff: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
            else
              echo "## Modules of ${GITHUB_REF_NAME}, the first release"
              echo
              echo "No published release yet: every module of go.mod ships for the first time."
              echo
              echo '```'
              awk '/^require \(/ { inside = 1; next } inside && /^\)/ { inside = 0 } inside || /^(go|toolchain|require) [^(]/' go.mod
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  goreleaser-release:
    needs: dependency-changes
    # The registries ingest public repositories only.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - name: Harden runner
        # Free for public repositories only: skipped while the repository is private.
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          # raw.githubusercontent.com, go.dev, dl.google.com: setup-go's
          # fallback hosts (govulncheck.yml explains them).
          allowed-endpoints: >
            api.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the previous tag for the release notes, and main for the check below
          persist-credentials: false

      - name: Check that the tag is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error title=Release::${GITHUB_REF_NAME} points to ${GITHUB_SHA}, which is not on main: tag a commit of main."
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Verify module sources
        run: go mod download && go mod verify

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # The registries check each release against the key of this provider,
      # 08C47C742E19A68E (RELEASE.md, Signing key): on the Terraform Registry
      # for the ippontech namespace since 2026-11-03, and on the OpenTofu
      # Registry for ippontech/mistral since 2026-11-03. Stop before anything
      # is published if the secret holds another key: the version tag cannot
      # be deleted, but with no GitHub release created yet, the job can run
      # again on the same tag once the secret is fixed. When the key is
      # rotated, change this fingerprint in a pull request, after the
      # registries know the new key, and before the next tag: a run reads
      # this file as its tag holds it. GoReleaser signs with this exact
      # primary key ("!" in .goreleaser.yml).
      - name: Check the signing key
        env:
          IMPORTED_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          PROVIDER_FINGERPRINT: B746617CC1BA2F43396E200008C47C742E19A68E
        run: |
          if [[ "${IMPORTED_FINGERPRINT^^}" != "${PROVIDER_FINGERPRINT}" ]]; then
            echo "::error title=Release::GPG_PRIVATE_KEY holds the key '${IMPORTED_FINGERPRINT}', not ${PROVIDER_FINGERPRINT}, the key the registries know for this provider. If the secret is wrong, fix it in the release environment and rerun the failed jobs. If the key was rotated to that one, a rerun cannot help (it runs this file as the tag holds it): change PROVIDER_FINGERPRINT on main, then release a new version."
            exit 1
          fi

      - name: Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          # The tag that triggered this run. Without it GoReleaser takes the
          # first tag on the commit in version order, so the run of
          # v1.0.0-rc.1 and the run of v1.0.0 on the same commit would build
          # the same version.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # The notes start at the last published release, read by the
          # dependency-changes job: without it GoReleaser starts at the nearest
          # earlier tag, which may be a tag whose release was refused, or a
          # pre-release, and the notes would leave out their commits. Empty
          # while no release is published: GoReleaser then looks for the
          # nearest earlier tag itself.
          GORELEASER_PREVIOUS_TAG: ${{ needs.dependency-changes.outputs.previous }}
