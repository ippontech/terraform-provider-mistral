name: GoReleaser Release

# Builds and signs the archives of a release, attaches them to its GitHub
# release and publishes it, when semantic-release pushes a version tag on main
# (semantic-release.yml; RELEASE.md, How a release is cut). semantic-release
# creates the release as a draft, with its notes; GoReleaser uploads into the
# draft and publishes it last, so that the Terraform Registry, whose webhook
# reads a release when it is published, finds the archives and the signature
# there. The OpenTofu Registry ingests the published release too.
#
# The job holds the signing key, so it follows the rules for privileged jobs
# (RELEASE.md, Release security):
#   - the GPG key and its passphrase are secrets of the protected `release`
#     environment, not repository secrets;
#   - no cache is restored or saved: a tag run can restore the caches of
#     main, so a cache written by any job on main could otherwise run code
#     in the job that signs;
#   - the checkout keeps no credential (persist-credentials: false), and the
#     modules are verified against go.sum before the build;
#   - tags are protected by a ruleset (RELEASE.md), so only the
#     semantic-release App and repository admins create them, and nobody
#     moves or deletes them;
#   - the tagged commit must be on main, so that a release ships only what
#     the pull request checks accepted.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions: {}

# One group per tag, not one for the workflow: GitHub keeps a single pending
# run per group, so with one group a run waiting for its approval behind
# another would be cancelled by the next tag, and its version would stay a
# draft with no asset for good. Two tags signing at once share nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Runs before the approval that releases the GPG key, with no secret: it
  # writes on the run's summary page the go.mod lines that changed since the
  # last release that shipped signed binaries (tools/previous-release.sh), which
  # the approver checks (RELEASE.md, Approving a release); go.mod lists every
  # module compiled into the provider. A version tagged but never signed (its
  # signing refused, its release deleted) is not a baseline: its changes are
  # listed again rather than shipping unseen, and the summary names it.
  dependency-changes:
    # The registries ingest public repositories only.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - name: Harden runner
        # Free for public repositories only: skipped while the repository is private.
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the previous release tag and its go.mod
          persist-credentials: false

      # From the parent of the tagged commit, so that the tag under release is
      # never its own baseline; gh reads the assets of each release with the
      # read-only token of the job.
      - name: Find the last release with signed binaries
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "previous=$(tools/previous-release.sh "${GITHUB_SHA}^")" >> "${GITHUB_OUTPUT}"

      - name: List the go.mod changes since the last signed release
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          {
            if [ -n "${PREVIOUS}" ]; then
              previous=${PREVIOUS}
              # `|| true`: with no such tag, the usual case, grep exits 1 and
              # pipefail would fail the step.
              unsigned=$(git tag --merged "${GITHUB_SHA}^" --list 'v[0-9]*.[0-9]*.[0-9]*' --no-merged "${previous}" | grep -v -- - | sort -V | tr '\n' ' ' || true)
              changes=$(git diff --unified=0 "${previous}" "${GITHUB_SHA}" -- go.mod | grep -E '^[-+][^-+]' || true)
              echo "## go.mod changes from ${previous} to ${GITHUB_REF_NAME}"
              echo
              if [ -n "${unsigned}" ]; then
                echo "${previous} is the last release with signed binaries. Tagged but never signed, so included here: ${unsigned}."
                echo
              fi
              if [ -z "${changes}" ]; then
                echo "None: this release compiles the same modules as ${previous}."
              else
                echo "Check each change before approving the release job (RELEASE.md, *Approving a release*)."
                echo
                echo '```diff'
                echo "${changes}"
                echo '```'
              fi
              echo
              echo "Full diff: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
            else
              echo "## Modules of ${GITHUB_REF_NAME}, the first release"
              echo
              echo "No release with signed binaries yet: every module of go.mod ships for the first time."
              echo
              echo '```'
              awk '/^require \(/ { inside = 1; next } inside && /^\)/ { inside = 0 } inside || /^(go|toolchain|require) [^(]/' go.mod
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  goreleaser-release:
    needs: dependency-changes
    # The registries ingest public repositories only.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - name: Harden runner
        # Free for public repositories only: skipped while the repository is private.
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          # raw.githubusercontent.com, go.dev, dl.google.com: setup-go's
          # fallback hosts (govulncheck.yml explains them).
          allowed-endpoints: >
            api.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the previous tag for the release notes, and main for the check below
          persist-credentials: false

      - name: Check that the tag is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error title=Release::${GITHUB_REF_NAME} points to ${GITHUB_SHA}, which is not on main: tag a commit of main."
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Verify module sources
        run: go mod download && go mod verify

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # The registries check each release against the key of this provider,
      # 08C47C742E19A68E (RELEASE.md, Signing key): on the Terraform Registry
      # for the ippontech namespace since 2026-11-03, and on the OpenTofu
      # Registry for ippontech/mistral since 2026-11-03. Stop before anything
      # is published if the secret holds another key: the version tag cannot
      # be deleted, but with no GitHub release created yet, the job can run
      # again on the same tag once the secret is fixed. When the key is
      # rotated, change this fingerprint in a pull request, after the
      # registries know the new key, and before the next tag: a run reads
      # this file as its tag holds it. GoReleaser signs with this exact
      # primary key ("!" in .goreleaser.yml).
      - name: Check the signing key
        env:
          IMPORTED_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          PROVIDER_FINGERPRINT: B746617CC1BA2F43396E200008C47C742E19A68E
        run: |
          if [[ "${IMPORTED_FINGERPRINT^^}" != "${PROVIDER_FINGERPRINT}" ]]; then
            echo "::error title=Release::GPG_PRIVATE_KEY holds the key '${IMPORTED_FINGERPRINT}', not ${PROVIDER_FINGERPRINT}, the key the registries know for this provider. If the secret is wrong, fix it in the release environment and rerun the failed jobs. If the key was rotated to that one, a rerun cannot help (it runs this file as the tag holds it): change PROVIDER_FINGERPRINT on main, then release a new version."
            exit 1
          fi

      - name: Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          # The tag that triggered this run. Without it GoReleaser takes the
          # first tag on the commit in version order, so the run of
          # v1.0.0-rc.1 and the run of v1.0.0 on the same commit would build
          # the same version.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
