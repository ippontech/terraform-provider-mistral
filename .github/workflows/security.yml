name: Security

# Workflow linters (actionlint, poutine and a pull_request_target guard) and
# tflint on every pull request. Secrets and vulnerable dependencies have their
# own workflows (gitleaks.yml, govulncheck.yml).

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # Free for public repositories only: skipped while the repository is private.
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      # pull_request_target runs with the repository's secrets on code from a
      # fork; no workflow here needs it. poutine flags its dangerous uses, this
      # refuses any use as a trigger (a key or a list item of on:), so that a
      # new workflow cannot start with one.
      - name: Refuse pull_request_target
        run: |
          if grep -rnE '^\s*pull_request_target\s*:|^\s*-\s*pull_request_target\s*$|^on:\s*(\[[^]]*)?pull_request_target' .github/workflows; then
            echo "::error title=pull_request_target::No workflow may use pull_request_target: it runs fork code with the repository's secrets."
            exit 1
          fi

  poutine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # Free for public repositories only: skipped while the repository is private.
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same method as tflint below: the expected hash is pinned here, not read
      # from the release's checksums file. Bump POUTINE_VERSION and
      # POUTINE_SHA256 together (value from the target release's
      # poutine_<version>_checksums.txt, poutine_Linux_x86_64.tar.gz line).
      # Renovate only bumps the version, so its PR fails here until the hash is
      # updated by hand; renovate.json excludes poutine from automerge.
      - name: Install poutine
        env:
          # renovate: datasource=github-releases depName=boostsecurityio/poutine
          POUTINE_VERSION: v1.1.6
          POUTINE_SHA256: abde716599a65608b023a69ed9316e5f083a7bca48612151c2720835883757ea
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/poutine_Linux_x86_64.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/boostsecurityio/poutine/releases/download/${POUTINE_VERSION}/poutine_Linux_x86_64.tar.gz"
          echo "${POUTINE_SHA256}  ${archive}" | sha256sum -c -
          install_dir="${RUNNER_TEMP}/poutine"
          mkdir -p "${install_dir}"
          tar xzf "${archive}" -C "${install_dir}" poutine
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/poutine" version

      - name: Run poutine
        run: poutine analyze_local . --config tools/.poutine.yml --fail-on-violation

  tflint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # Free for public repositories only: skipped while the repository is private.
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installed from the GitHub release with checksum verification rather than
      # through a third-party action (poutine flags setup-tflint's unverified
      # creator, and a pinned binary is the smaller supply-chain surface).
      #
      # The expected hash is pinned here, not read from the release's own
      # checksums.txt: both files come from the same source, so a compromised
      # release would poison the checksum along with the binary. Bump
      # TFLINT_VERSION and TFLINT_SHA256 together (value from the target
      # release's checksums.txt, tflint_linux_amd64.zip line). Renovate only
      # bumps the version, so its PR goes red here until the hash is updated
      # by hand; renovate.json therefore excludes tflint from automerge.
      - name: Install tflint
        env:
          # renovate: datasource=github-releases depName=terraform-linters/tflint
          TFLINT_VERSION: v0.64.0
          TFLINT_SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
        run: |
          set -euo pipefail
          base="https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}"
          curl -fsSLO "${base}/tflint_linux_amd64.zip"
          echo "${TFLINT_SHA256}  tflint_linux_amd64.zip" | sha256sum -c -
          install_dir="${RUNNER_TEMP}/tflint"
          mkdir -p "${install_dir}"
          unzip -o -q tflint_linux_amd64.zip -d "${install_dir}"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/tflint" --version

      # .tflint.hcl enables the full terraform ruleset (preset "all"); the
      # bundled ruleset needs no `tflint --init`. Lints every module in the
      # repo (examples, tests), not just the files a commit touched (#229).
      - name: Run tflint
        run: tflint --recursive --format compact
