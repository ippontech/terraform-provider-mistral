name: Conventional Commits

# The release notes group the commits of main by their Conventional Commits
# type (.goreleaser.yml), and the maintainer reads them to choose the next
# version (RELEASE.md). A squash merge turns the PR title into that commit,
# and a rebase merge puts every commit of the branch on main, so both are
# checked here, by tools/conventional-commits.sh (rules there), the same
# script as the commit-msg hook of .pre-commit-config.yaml.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The checks make no network call besides the checkout and the download
      # of svu.
      - name: Harden runner
        # Free for public repositories only: skipped while the repository is private.
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the check
        run: tools/conventional-commits_test.sh

      # The release version follows the same types (tools/release-version.sh).
      # Same method as the tools of security.yml: the expected hash is pinned
      # here, not read from the release's checksums.txt, which comes from the
      # same source. It was checked against that checksums.txt, whose Sigstore
      # bundle verifies against svu's release workflow, and against the build
      # provenance of the archive (gh attestation verify --repo caarlos0/svu).
      # The same pin is in conventional-commits.yml, goreleaser-release.yml and
      # release-reminder.yml: Renovate bumps the three and mise.toml in one pull
      # request, the version only, so it fails until the three hashes are
      # updated by hand.
      - name: Install svu
        env:
          # renovate: datasource=github-releases depName=caarlos0/svu
          SVU_VERSION: v3.4.4
          SVU_SHA256: f113776c1c4c2a2a3c6e27991efaa8071aafc1ec5644fa77ff809ec69aacd5da
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/svu_linux_amd64.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/caarlos0/svu/releases/download/${SVU_VERSION}/svu_${SVU_VERSION#v}_linux_amd64.tar.gz"
          echo "${SVU_SHA256}  ${archive}" | sha256sum -c -
          install_dir="${RUNNER_TEMP}/svu"
          mkdir -p "${install_dir}"
          tar xzf "${archive}" -C "${install_dir}" svu
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/svu" --version

      - name: Test the release version
        run: tools/release-version_test.sh

      # In the merge queue the title was already checked on the pull request;
      # the job still runs so that a required check reports there too.
      - name: Check the PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: tools/conventional-commits.sh title

  commit-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # Free for public repositories only: skipped while the repository is private.
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      # The whole history, to walk from the base to the head of the pull
      # request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check every commit of the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: tools/conventional-commits.sh range "${BASE}..${HEAD}"
