name: Spec Drift

# Every week, fetches Mistral's OpenAPI specification and compares the
# operations the provider calls (the routes of its fakes) with the
# fingerprints committed in tools/specdrift/fingerprints.txt. A change of
# contract opens an issue labelled spec-drift, or comments on the one already
# open. The specification has no licence: the run downloads it to its
# temporary directory and never commits it.
on:
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch:

permissions: {}

concurrency:
  group: spec-drift
  cancel-in-progress: false

jobs:
  spec-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner
        # Free for public repositories only: skipped while the repository is private.
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          # raw.githubusercontent.com, go.dev, dl.google.com: setup-go's
          # fallback hosts (govulncheck.yml explains them).
          allowed-endpoints: >
            api.github.com:443
            dl.google.com:443
            docs.mistral.ai:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: this job holds a token that writes issues.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'tools/go.mod'
          cache: false

      - name: Fetch the specification
        run: curl -sSf --retry 3 -o "${RUNNER_TEMP}/openapi.yaml" https://docs.mistral.ai/openapi.yaml

      # specdrift exits 1 on a drift, which is reported below, and 2 on an
      # error, which fails the job.
      - name: Compare the fingerprints
        id: compare
        run: |
          set +e
          go run -C tools ./specdrift -spec "${RUNNER_TEMP}/openapi.yaml" -root .. > "${RUNNER_TEMP}/report.md"
          code=$?
          set -e
          cat "${RUNNER_TEMP}/report.md" >> "${GITHUB_STEP_SUMMARY}"
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          if [ "${code}" -gt 1 ]; then exit "${code}"; fi

      - name: Open or update the spec-drift issue
        if: steps.compare.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          body="${RUNNER_TEMP}/body.md"
          {
            echo "The weekly run of tools/specdrift found operations the provider calls whose contract changed in Mistral's OpenAPI specification."
            echo
            cat "${RUNNER_TEMP}/report.md"
            echo "Update the client and the fakes, then run \`specdrift -update\` in the same pull request."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          } > "${body}"
          number=$(gh issue list --repo "${REPO}" --label spec-drift --state open --json number --jq '.[0].number // empty')
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --repo "${REPO}" --body-file "${body}"
          else
            gh issue create --repo "${REPO}" --title "Mistral's API specification changed for operations the provider calls" --label spec-drift --body-file "${body}"
          fi
