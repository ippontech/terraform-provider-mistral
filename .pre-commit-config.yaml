# `pre-commit install` installs both hook types: the hooks below run at the
# pre-commit stage, and the commit-msg hook checks the Conventional Commits
# format that the release notes group by (CONTRIBUTING.md, Conventional Commits).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^docs/
      - id: trailing-whitespace
        exclude: ^docs/
  # The same check as the Conventional Commits workflow: one script, so the
  # hook and CI cannot disagree.
  - repo: local
    hooks:
      - id: conventional-commits
        name: conventional commits
        language: script
        entry: tools/conventional-commits.sh message
        stages: [commit-msg]
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.3
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: poutine
        name: poutine
        language: system
        entry: mise exec -- poutine analyze_local . --config tools/.poutine.yml --fail-on-violation
        pass_filenames: false
        always_run: true
      # Secrets in the staged changes, with the rules of .gitleaks.toml, at the
      # version pinned in mise.toml (the gitleaks workflow scans the commits of
      # a pull request). A deliberate fake in a test takes `gitleaks:allow` at
      # the end of its line.
      - id: gitleaks
        name: gitleaks
        language: system
        entry: mise exec -- gitleaks git --pre-commit --staged --config .gitleaks.toml --redact --no-banner --verbose
        pass_filenames: false
  # Go hooks run the versions pinned in mise.toml (Go, golangci-lint), so they
  # match `make lint` and the CI lint job.
  - repo: local
    hooks:
      # gofmt + goimports as configured in .golangci.yml, on the staged files.
      - id: golangci-lint-fmt
        name: golangci-lint fmt
        language: system
        entry: mise exec -- golangci-lint fmt
        types: [go]
      # Lints the whole tree, the tools module included, as the CI lint job
      # does (make lint).
      - id: golangci-lint
        name: golangci-lint run
        language: system
        entry: mise exec -- make lint
        types: [go]
        pass_filenames: false
        require_serial: true
      - id: go-mod-tidy
        name: go mod tidy -diff
        language: system
        entry: mise exec -- make tidy-check
        files: ^(tools/)?go\.(mod|sum)$|\.go$
        pass_filenames: false
