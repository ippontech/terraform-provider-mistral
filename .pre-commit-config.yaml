# `pre-commit install` installs both hook types: the hooks below run at the
# pre-commit stage, and the commit-msg hook checks the Conventional Commits
# format that the release notes group by (CONTRIBUTING.md, Conventional Commits).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
# Each remote hook is pinned to the commit of its tag, which a moved tag
# cannot change, with the tag in a `# frozen:` comment: the format of
# `pre-commit autoupdate --freeze`, which Renovate keeps when it bumps a
# frozen rev (it cannot freeze a rev pinned by tag).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^docs/
      - id: trailing-whitespace
        exclude: ^docs/
  # The same check as the Conventional Commits workflow: one script, so the
  # hook and CI cannot disagree.
  - repo: local
    hooks:
      - id: conventional-commits
        name: conventional commits
        language: script
        entry: tools/conventional-commits.sh message
        stages: [commit-msg]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      # Terraform and tflint at the versions of mise.toml, with the commands
      # of CI (make terraform-fmt-check in terraform.yml, tflint in
      # security.yml), over every module rather than the staged files only.
      # fmt rewrites the files; the CI job checks them.
      - id: terraform-fmt
        name: terraform fmt
        language: system
        entry: mise exec -- terraform fmt -recursive
        files: \.(tf|tfvars|hcl)$
        pass_filenames: false
      - id: tflint
        name: tflint
        language: system
        entry: mise exec -- tflint --recursive --format compact
        files: \.(tf|tfvars|hcl)$
        pass_filenames: false
      - id: poutine
        name: poutine
        language: system
        entry: mise exec -- poutine analyze_local . --config tools/.poutine.yml --fail-on-violation
        pass_filenames: false
        always_run: true
      # The audits of the zizmor CI job that need no network. --offline turns
      # off the ones that query GitHub with a token, which run in CI only:
      # impostor-commit, ref-confusion, known-vulnerable-actions,
      # stale-action-refs and ref-version-mismatch (zizmor 1.31.1, -v lists
      # the ones it skips). Also run when mise.toml changes, so that the
      # commit that bumps zizmor audits the workflows with the new version.
      - id: zizmor
        name: zizmor
        language: system
        entry: mise exec -- zizmor --offline .
        pass_filenames: false
        files: ^(\.github/|mise\.toml$)
      # Secrets in the staged changes, with the rules of .gitleaks.toml, at the
      # version pinned in mise.toml (the gitleaks workflow scans the commits of
      # a pull request). A deliberate fake in a test takes `gitleaks:allow` at
      # the end of its line.
      - id: gitleaks
        name: gitleaks
        language: system
        entry: mise exec -- gitleaks git --pre-commit --staged --config .gitleaks.toml --redact --no-banner --verbose
        pass_filenames: false
  # Go hooks run the versions pinned in mise.toml (Go, golangci-lint), so they
  # match `make lint` and the CI lint job.
  - repo: local
    hooks:
      # gofmt + goimports as configured in .golangci.yml, on the staged files.
      - id: golangci-lint-fmt
        name: golangci-lint fmt
        language: system
        entry: mise exec -- golangci-lint fmt
        types: [go]
      # Lints the whole tree, the tools module included, as the CI lint job
      # does (make lint).
      - id: golangci-lint
        name: golangci-lint run
        language: system
        entry: mise exec -- make lint
        types: [go]
        pass_filenames: false
        require_serial: true
      - id: go-mod-tidy
        name: go mod tidy -diff
        language: system
        entry: mise exec -- make tidy-check
        files: ^(tools/)?go\.(mod|sum)$|\.go$
        pass_filenames: false
